<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="3; url=https://provedcat.github.io/Proved/">
  <link rel="canonical" href="https://provedcat.github.io/Proved/">
  <title>Proved로 이동 중</title>
  <script>
    (async () => {
      const target = 'https://provedcat.github.io/Proved/';

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }

        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
        }
      } catch (error) {
        console.warn('기존 ProvedCat 캐시 정리에 실패했습니다.', error);
      } finally {
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <main>
    <p>새로운 Proved로 이동 중입니다.</p>
    <p><a href="https://provedcat.github.io/Proved/">자동으로 이동하지 않으면 여기를 눌러주세요.</a></p>
  </main>
</body>
</html>
