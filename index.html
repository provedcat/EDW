<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef"><title>EUNDONG DAILY</title>
  <link rel="stylesheet" href="css/app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
<header><div><p class="eyebrow">EUNDONG DAILY</p><h1 id="todayLabel">오늘</h1></div><span class="local-badge">은동이 전용</span></header>
<main>
  <div id="notice" class="notice">이 브라우저에 기록을 준비하고 있습니다.</div>
  <section aria-labelledby="weightTitle">
    <div class="section-head"><h2 id="weightTitle">오늘의 체중</h2><span id="saveState" class="save-state">—</span></div>
    <div class="weight-row"><label>오늘 <span class="unit-input"><input id="weight" type="number" min="0" step="0.01" inputmode="decimal"><b>kg</b></span></label><span class="arrow">→</span><label>목표 <span class="unit-input"><input id="goalWeight" type="number" min="0" step="0.01" inputmode="decimal"><b>kg</b></span></label></div>
    <div class="goal-meta"><strong id="remaining">목표를 입력해 주세요</strong><label>시작일 <input id="goalStart" type="date"></label></div>
    <div id="weeklyGoal" class="weekly-goal">주차별 목표 —</div>
  </section>
  <section aria-labelledby="chartTitle"><div class="section-head"><h2 id="chartTitle">체중 · 수분 추이</h2><span>최근 30일</span></div><div class="chart-wrap"><canvas id="trendChart"></canvas><p id="chartEmpty">기록이 쌓이면 추이를 보여드려요.</p></div></section>
  <section aria-labelledby="feedsTitle"><div class="section-head"><h2 id="feedsTitle">오늘 사용할 습사료</h2><span>최대 3개</span></div><div id="feedSlots" class="feed-slots"></div></section>
  <section aria-labelledby="mealsTitle"><div class="section-head"><h2 id="mealsTitle">오늘의 4회 급여</h2><span>입력 시 자동 저장</span></div><div id="meals" class="meals"></div></section>
  <section aria-labelledby="totalTitle"><h2 id="totalTitle">오늘의 합계</h2><div id="totals" class="totals"></div><p id="missingInfo" class="missing"></p></section>
  <section class="data-tools" aria-labelledby="dataTitle"><div><h2 id="dataTitle">데이터 관리</h2><p>브라우저 데이터 삭제에 대비해 기록을 파일로 보관하세요.</p></div><div class="data-actions"><button id="backupButton" class="quiet">데이터 백업</button><button id="restoreButton" class="quiet">데이터 복원</button><input id="restoreFile" type="file" accept="application/json,.json" hidden></div><p id="dataMessage" class="data-message" role="status"></p></section>
</main>
<dialog id="feedDialog"><form method="dialog" class="dialog-head"><div><p class="eyebrow">습식사료 선택</p><h2 id="dialogTitle">습사료 1</h2></div><button aria-label="닫기" class="icon-button">×</button></form><label class="search"><span>제품명 검색</span><input id="feedSearch" type="search" autocomplete="off" placeholder="두 글자 이상 입력"></label><div id="feedResults" class="results"></div></dialog>
<footer>개인 기록은 서버가 아닌 이 브라우저의 localStorage에만 저장됩니다.</footer>
</body></html>
